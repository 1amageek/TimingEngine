name: Sky130A timing qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sky130A:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      SKY130_REVISION: c6d73a35f524070e85faff4a6a9eef49553ebc2b
      OPENSTA_REVISION: dc5ccd2d6941289a6a7d3c918b10b493f44a7f56
    steps:
      - name: Check out TimingEngine
        uses: actions/checkout@v4

      - name: Check out pinned OpenSTA
        uses: actions/checkout@v4
        with:
          repository: parallaxsw/OpenSTA
          ref: ${{ env.OPENSTA_REVISION }}
          path: .opensta-source

      - name: Select signed OSS Swift 6.4.0
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -eq 27
          test "$(uname -m)" = arm64
          xcodebuild -version
          pkg="$RUNNER_TEMP/swift-6.4.0-RELEASE-osx.pkg"
          curl --fail --location --max-time 600 \
            https://download.swift.org/swift-6.4.0-release/xcode/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-osx.pkg \
            --output "$pkg"
          pkgutil --check-signature "$pkg" > "$RUNNER_TEMP/swift-signature.txt"
          cat "$RUNNER_TEMP/swift-signature.txt"
          grep -Fq 'Developer ID Installer: Swift Open Source (V9AUD2URP3)' \
            "$RUNNER_TEMP/swift-signature.txt"
          installer -target CurrentUserHomeDirectory -pkg "$pkg"
          toolchain="$HOME/Library/Developer/Toolchains/swift-6.4.0-RELEASE.xctoolchain"
          toolchain_id="$(plutil -extract CFBundleIdentifier raw "$toolchain/Info.plist")"
          test "$toolchain_id" = org.swift.640202609131a
          test "$(plutil -extract Version raw "$toolchain/Info.plist")" = 6.4.20260913101
          export TOOLCHAINS="$toolchain_id"
          export PATH="$toolchain/usr/bin:$PATH"
          echo "TOOLCHAINS=$TOOLCHAINS" >> "$GITHUB_ENV"
          echo "$toolchain/usr/bin" >> "$GITHUB_PATH"
          test "$(command -v swift)" = "$toolchain/usr/bin/swift"
          test "$(xcrun --find swift)" = "$toolchain/usr/bin/swift"
          swift --version | tee "$RUNNER_TEMP/swift-version.txt"
          grep -Fxq 'Apple Swift version 6.4 (swift-6.4-RELEASE)' "$RUNNER_TEMP/swift-version.txt"
          xcrun swift --version | tee "$RUNNER_TEMP/xcrun-swift-version.txt"
          grep -Fxq 'Apple Swift version 6.4 (swift-6.4-RELEASE)' "$RUNNER_TEMP/xcrun-swift-version.txt"

      - name: Cache independent tool and process assets
        uses: actions/cache@v4
        with:
          path: |
            .opensta-install
            ~/.volare
          key: sky130A-opensta-${{ env.OPENSTA_REVISION }}-${{ env.SKY130_REVISION }}

      - name: Install OpenSTA build dependencies
        run: brew install bison boost cmake eigen flex mht208/formal/cudd swig tcl-tk

      - name: Build pinned OpenSTA
        run: |
          if [ ! -x "$PWD/.opensta-install/bin/sta" ]; then
            export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
            export CMAKE_INCLUDE_PATH="$(brew --prefix flex)/include:$(brew --prefix mht208/formal/cudd)/include"
            export CMAKE_LIBRARY_PATH="$(brew --prefix flex)/lib:$(brew --prefix bison)/lib:$(brew --prefix mht208/formal/cudd)/lib"
            cmake \
              -S .opensta-source \
              -B .opensta-build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$(brew --prefix mht208/formal/cudd)" \
              -DCMAKE_INSTALL_PREFIX="$PWD/.opensta-install"
            cmake --build .opensta-build --parallel 3
            cmake --install .opensta-build
          fi

      - name: Acquire pinned Sky130A process assets
        run: |
          python3 -m venv .build/volare-environment
          .build/volare-environment/bin/pip install volare==0.20.6
          .build/volare-environment/bin/volare enable \
            --pdk sky130 \
            "$SKY130_REVISION"

      - name: Run production API qualification
        run: |
          opensta_bin="$PWD/.opensta-install/bin/sta"
          opensta_version=$(
            "$opensta_bin" -version 2>&1 |
              awk '{ for (field = 1; field <= NF; field += 1) if ($field ~ /^[0-9]+([.][0-9]+)+/) { print $field; exit } }'
          )
          if [ -z "$opensta_version" ]; then
            echo "Unable to resolve the exact OpenSTA version token." >&2
            exit 2
          fi
          OPENSTA_BIN="$opensta_bin" \
          OPENSTA_VERSION="$opensta_version" \
          SKY130_ROOT="$HOME/.volare/sky130A" \
          OUTPUT_ROOT="$PWD/qualification-evidence" \
          ./Scripts/qualify-sky130A.sh

      - name: Verify every corner passed
        run: |
          for corner in ss-100C-1v60 tt-025C-1v80 ff-n40C-1v95
          do
            jq -e '
              (.findings | length) == 0
              and .externalCorrelation.correlation.status == "passed"
            ' \
              "qualification-evidence/sky130-$corner-evidence-assessment.json"
          done

      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky130A-timing-qualification
          path: qualification-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
